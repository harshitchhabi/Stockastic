# Put in /etc/sysctl.d/ and run: sysctl --system   (harden.sh does this)

# ---- room for a crowd ----
# A larger queue for connections that arrive in the same instant (for example, everyone logging in at once).
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
# Notice a half-open connection sooner.
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 4

# ---- protection against network floods and spoofing ----
# SYN cookies keep the server answering honest people while a flood of half-open connections is aimed at it.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_synack_retries = 3
# Drop packets that claim an address they could not have come from.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Ignore redirects and source routing, and do not answer broadcast pings.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Do not let closed connections pile up in TIME_WAIT under a burst.
net.ipv4.tcp_fin_timeout = 20
net.ipv4.tcp_tw_reuse = 1
# Not a router.
net.ipv4.ip_forward = 0
